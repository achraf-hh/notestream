name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# The jobs only read the repository.
permissions:
  contents: read

# A new push to the same branch or PR cancels the run it replaces.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (lint, tests, dataset schema)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: notestream-ai
    steps:
      # Actions are pinned to commit SHAs: a tag can be moved to different code, a SHA can't.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13" # matches notestream-ai/Dockerfile
          cache: pip
          cache-dependency-path: |
            notestream-ai/requirements.txt
            notestream-ai/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: pytest
      # The checks against chunks need a running stack, so CI only checks the file's structure.
      - run: python -m eval.harness.validate --schema-only

  java:
    name: Java (tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-java
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      # contextLoads starts a pgvector container through Testcontainers, using the runner's Docker.
      - run: ./gradlew test

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker compose build
        env:
          OPENAI_API_KEY: not-needed-to-build
