# Full NoteStream stack: Postgres (pgvector) + Python AI service + Java API.
# Run: docker compose up --build
# Requires a repo-root .env with OPENAI_API_KEY set (see .env.example).

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: notestream
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d notestream"]
      interval: 5s
      timeout: 3s
      retries: 10

  ai:
    build: ./notestream-ai
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./backend-java
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/notestream
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      AI_SERVICE_URL: http://ai:8000
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      ai:
        condition: service_healthy

volumes:
  pgdata:
